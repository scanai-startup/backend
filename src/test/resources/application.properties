# Configuração para testes - usando banco de desenvolvimento
# Usar as mesmas configurações do banco de dev (com fallbacks para desenvolvimento local)
spring.datasource.url=${DB_URL_DEV}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Manter os dados no banco (não resetar)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar Flyway para usar as migracoes do banco real
spring.flyway.enabled=true

# Token secret
api.security.token.secret=${SECRET:my-secret-key}

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
