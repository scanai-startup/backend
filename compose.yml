services:
  mysql:
    container_name: mysql
    image: mysql:8
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scanAiDev

  app:
    container_name: springboot_app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 8080
    ports:
      - "8080:8080"
    environment:
      - PROFILE=dev
      - DB_URL_DEV=jdbc:mysql://mysql:3306/scanAiDev
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SECRET=250c089a-5651-4e1c-82cd-7fe00a6190ee
    depends_on:
      - mysql
volumes:
  mysql_data: